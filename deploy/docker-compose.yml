# hl-stream with Prometheus and Grafana.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# Grafana: http://localhost:3000 (admin / admin), dashboard "Hyperliquid stream".
# WebSocket: ws://localhost:8546. Metrics: http://localhost:9100/metrics.
#
# Host networking lets peers reach the callback ports 4001 and 4002 on the
# host's public address; open both ports in the firewall.
services:
  hl-stream:
    build: ..
    network_mode: host
    restart: unless-stopped
    environment:
      RUST_LOG: info
    command:
      - --peers-cache=/data/peers.json
      - --metrics-addr=127.0.0.1:9100
      - --log-format=json
      - serve
      - --listen=0.0.0.0:8546
    volumes:
      - hl-stream:/data

  prometheus:
    image: prom/prometheus:v3.5.0
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    network_mode: host
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_PORT: "3000"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana

volumes:
  hl-stream:
  prometheus:
  grafana:
