[workspace]
members = [
    "crates/protocol",
    "crates/stream",
    "crates/ws",
    "bin/hl-stream",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
keywords = ["hyperliquid", "mempool", "p2p", "blockchain", "streaming"]
categories = ["cryptography::cryptocurrencies", "network-programming"]

[workspace.dependencies]
hyperliquid-protocol = { path = "crates/protocol", version = "0.1.0" }
hyperliquid-stream = { path = "crates/stream", version = "0.1.0" }
hyperliquid-ws = { path = "crates/ws", version = "0.1.0" }
anyhow = "1"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode"] }
metrics = "0.24"
metrics-derive = "0.1"
metrics-exporter-prometheus = { version = "0.17", default-features = false, features = ["http-listener"] }
metrics-util = { version = "0.20", default-features = false, features = ["layers"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
thiserror = "2"
tokio = { version = "1.43", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = "0.28"
tracing = "0.1"
zstd = { version = "0.13", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cast_lossless = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
